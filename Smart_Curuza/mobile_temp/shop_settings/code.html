<body class="bg-pattern text-gray-800 dark:text-gray-200 font-body min-h-screen pb-24 relative">
<header class="bg-sidebar-dark text-white px-4 py-3 sticky top-0 z-50 shadow-md">

<div class="px-5 pt-6 pb-2">

<div>

<button class="whitespace-nowrap pb-3 px-1 border-b-2 border-transparent font-display font-medium text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">

                </button>
<button class="whitespace-nowrap pb-3 px-1 border-b-2 border-transparent font-display font-medium text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">

<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="business-name">Business Name</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-outlined text-gray-400 text-lg">storefront</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg py-3 bg-white dark:bg-gray-800 dark:text-white placeholder-gray-400" id="business-name" name="business-name" placeholder="Enter business name" type="text" value="Xxx Fashion House"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="phone-number">Phone Number</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-outlined text-gray-400 text-lg">call</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg py-3 bg-white dark:bg-gray-800 dark:text-white placeholder-gray-400" id="phone-number" name="phone-number" placeholder="Ex: 250788..." type="tel" value="250788451422"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="tin-number">TIN Number</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-outlined text-gray-400 text-lg">description</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg py-3 bg-white dark:bg-gray-800 dark:text-white placeholder-gray-400" id="tin-number" name="tin-number" type="text" value="438029333"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="address">Address</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute top-3 left-0 pl-3 flex items-start pointer-events-none">
<span class="material-icons-outlined text-gray-400 text-lg">place</span>
</div>
<textarea class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg py-3 bg-white dark:bg-gray-800 dark:text-white placeholder-gray-400 resize-none" id="address" name="address" rows="3">Kigali, Rwanda</textarea>
</div>
</div>
