{% extends 'core/base_admin.html' %}
{% load static %}

{% block title %}Edit Student - TypeSpire 2.0{% endblock %}

{% block page_title %}Edit Student{% endblock %}
{% block page_subtitle %}Update student profile information{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl p-6">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Student ID -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Student ID</label>
                    <input type="text" name="student_id" value="{{ student.student_id }}" required
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
                </div>

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                    <input type="text" name="username" value="{{ student.user.username }}" required
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
                </div>
            </div>

            <!-- Full Name -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                <input type="text" name="full_name" value="{{ student.user.get_full_name }}" required
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Program -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Program</label>
                    <select name="program" required
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
                        {% for program in programs %}
                        <option value="{{ program.id }}" {% if program.id==student.program.id %}selected{% endif %}>
                            {{ program.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status</label>
                    <select name="status" required
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all">
                        <option value="Beginner" {% if student.current_status=='Beginner' %}selected{% endif %}>Beginner
                        </option>
                        <option value="Level 1" {% if student.current_status=='Level 1' %}selected{% endif %}>Level 1
                        </option>
                        <option value="Level 2" {% if student.current_status=='Level 2' %}selected{% endif %}>Level 2
                        </option>
                        <option value="Passed" {% if student.current_status=='Passed' %}selected{% endif %}>Passed
                        </option>
                    </select>
                </div>
            </div>

            <!-- Password (Optional) -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">New Password (leave blank to keep
                    current)</label>
                <input type="password" name="password"
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                    placeholder="••••••••">
            </div>

            <div class="flex gap-4 pt-4 border-t border-slate-700 mt-6">
                <a href="{% url 'manage_students' %}"
                    class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-lg transition-all text-center">
                    Cancel
                </a>
                <button type="submit"
                    class="px-6 py-2 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-600 hover:to-purple-700 text-white font-medium rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
