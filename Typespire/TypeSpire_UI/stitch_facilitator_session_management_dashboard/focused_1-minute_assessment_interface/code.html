<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Typespire - Focused Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#39E079", "background-light": "#f6f8f7", "background-dark": "#122017", success: "#3BB46D", error: "#EF4444"}, fontFamily: {display: "Lexend", body: ["Noto Sans", "sans-serif"]}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, keyframes: {blink: {"0%, 100%": {opacity: "1"}, "50%": {opacity: "0"}}}, animation: {blink: "blink 1s step-end infinite"}}}};</script>
<style>
        /* Custom scrollbar for text area if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col overflow-hidden text-[#0e161a] dark:text-[#f8fafb]">
<!-- Top Navigation & Stats Bar -->
<header class="bg-primary text-white shadow-lg w-full z-10 flex-none h-20">
<div class="max-w-[1400px] mx-auto px-6 h-full flex items-center justify-between">
<!-- Brand -->
<div class="flex items-center gap-3 opacity-90 hover:opacity-100 transition-opacity w-48">
<div class="size-8 flex items-center justify-center bg-white/10 rounded-lg">
<span class="material-symbols-outlined text-[20px]">keyboard_alt</span>
</div>
<h1 class="text-lg font-bold tracking-tight">Typespire</h1>
</div>
<!-- Central Stats -->
<div class="flex items-center gap-12">
<div class="flex flex-col items-center">
<span class="text-xs font-medium text-white/60 uppercase tracking-wider">Live WPM</span>
<span class="text-2xl font-bold leading-none mt-1">45</span>
</div>
<div class="w-px h-8 bg-white/10"></div>
<div class="flex flex-col items-center">
<span class="text-xs font-medium text-white/60 uppercase tracking-wider">Accuracy</span>
<span class="text-2xl font-bold leading-none mt-1">98%</span>
</div>
</div>
<!-- Timer -->
<div class="flex items-center justify-end gap-3 w-48">
<span class="material-symbols-outlined text-white/60">timer</span>
<div class="font-mono text-3xl font-bold tracking-widest text-white">00:48</div>
</div>
</div>
</header>
<!-- Main Assessment Area -->
<main class="flex-1 flex flex-col items-center justify-center p-6 sm:p-10 relative">
<!-- Focus Container -->
<div class="w-full max-w-[960px] flex flex-col gap-8 flex-1 justify-center">
<!-- Typing Card -->
<div class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-[#e8eff2] dark:border-slate-700 p-12 sm:p-16 min-h-[400px] flex flex-col relative group cursor-text transition-all hover:shadow-md">
<!-- Focus Indicator (Subtle border glow simulation) -->
<div class="absolute inset-0 rounded-xl border-2 border-transparent group-hover:border-primary/5 pointer-events-none transition-colors"></div>
<!-- Text Content -->
<div class="relative text-[28px] sm:text-[32px] leading-[1.6] font-medium tracking-tight select-none outline-none" tabindex="0">
<!-- Text Mask / Blur (Optional for paused state) -->
<!-- <div class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex items-center justify-center rounded-lg hidden">
                        <p class="text-primary font-bold text-xl">Click to resume</p>
                    </div> -->
<!-- Correct words -->
<span class="text-success transition-colors duration-200">The</span>
<span class="text-success transition-colors duration-200">quick</span>
<span class="text-success transition-colors duration-200">brown</span>
<span class="text-success transition-colors duration-200">fox</span>
<!-- Incorrect word -->
<span class="text-error underline decoration-error decoration-2 underline-offset-4 decoration-wavy transition-colors duration-200">jummped</span>
<!-- Correct words -->
<span class="text-success transition-colors duration-200">over</span>
<span class="text-success transition-colors duration-200">the</span>
<!-- Active Word with Caret -->
<span class="relative inline-block text-[#0e161a] dark:text-white pl-0.5">
<span class="absolute -left-[2px] top-1 bottom-1 w-[3px] bg-primary rounded-full animate-blink"></span>
                        lazy
                    </span>
<!-- Future words -->
<span class="text-slate-300 dark:text-slate-600">dog.</span>
<span class="text-slate-300 dark:text-slate-600">Sphinx</span>
<span class="text-slate-300 dark:text-slate-600">of</span>
<span class="text-slate-300 dark:text-slate-600">black</span>
<span class="text-slate-300 dark:text-slate-600">quartz,</span>
<span class="text-slate-300 dark:text-slate-600">judge</span>
<span class="text-slate-300 dark:text-slate-600">my</span>
<span class="text-slate-300 dark:text-slate-600">vow.</span>
<span class="text-slate-300 dark:text-slate-600">Two</span>
<span class="text-slate-300 dark:text-slate-600">driven</span>
<span class="text-slate-300 dark:text-slate-600">jocks</span>
<span class="text-slate-300 dark:text-slate-600">help</span>
<span class="text-slate-300 dark:text-slate-600">fax</span>
<span class="text-slate-300 dark:text-slate-600">my</span>
<span class="text-slate-300 dark:text-slate-600">big</span>
<span class="text-slate-300 dark:text-slate-600">quiz.</span>
<span class="text-slate-300 dark:text-slate-600">Pack</span>
<span class="text-slate-300 dark:text-slate-600">my</span>
<span class="text-slate-300 dark:text-slate-600">box</span>
<span class="text-slate-300 dark:text-slate-600">with</span>
<span class="text-slate-300 dark:text-slate-600">five</span>
<span class="text-slate-300 dark:text-slate-600">dozen</span>
<span class="text-slate-300 dark:text-slate-600">liquor</span>
<span class="text-slate-300 dark:text-slate-600">jugs.</span>
</div>
</div>
<!-- Bottom Controls -->
<div class="flex items-center justify-between px-4 opacity-60 hover:opacity-100 transition-opacity">
<div class="flex items-center gap-2 text-sm font-medium text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-[18px]">keyboard</span>
<span>Press <kbd class="px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded text-xs mx-1 font-bold font-mono">Esc</kbd> to pause</span>
</div>
<button class="flex items-center gap-2 px-4 py-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-error transition-colors text-sm font-bold group">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">logout</span>
                    Exit Test
                </button>
</div>
</div>
</main>
</body></html>
